<h2>User List</h2>

<ul>
  @for (user of users; track user.id) {
    <li>
      <p>{{ user.name }}</p>

      <button
        (click)="navigateToUserDetail2(user.id)"
        style="margin-right: 10px;">
        View Details
      </button>

      <app-user-card
        [user]="user"
        (deleteUserWithID)="deleteUserWithID($event)">
      </app-user-card>
    </li>
  }
</ul>

<input
  type="text"
  [(ngModel)]="newUserName"
  placeholder="Enter user name">

<button (click)="addUser()">Add User</button>
